name: Link Checker

on:
  push:
    branches:
      - v5
    paths:
      - 'docs/**'
      - '.github/workflows/links.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Match docs.yml — VitePress config reads SITE_URL for og:url / canonical / sitemap.
env:
  SITE_URL: https://www.fontist.org

jobs:
  link_checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: docs/.lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check if site was built
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          echo "Site built successfully"
          ls -la dist/
        working-directory: docs/.vitepress

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --verbose
            --no-progress
            --config lychee.toml
            --root-dir ${{ github.workspace }}/docs/.vitepress/dist
            '.vitepress/dist/**/*.html'
          fail: true
          output: link-check-results.md
          format: markdown
          workingDirectory: docs

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: docs/link-check-results.md
          retention-days: 30

      - name: Comment PR with results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            // GitHub rejects PR comments longer than 65536 chars. The lychee
            // report often exceeds this when many formula URLs are broken, so
            // we cap the body and point readers to the uploaded artifact.
            const MAX_BODY = 60000;

            let comment = '## 🔗 Link Check Failed\n\n';
            comment += `Full report: [workflow run](${process.env.RUN_URL}) → download the \`link-check-results\` artifact.\n\n`;

            if (fs.existsSync('docs/link-check-results.md')) {
              const results = fs.readFileSync('docs/link-check-results.md', 'utf8');
              if (comment.length + results.length <= MAX_BODY) {
                comment += '### Results\n\n' + results;
              } else {
                const budget = MAX_BODY - comment.length - 200;
                const truncated = results.substring(0, budget);
                const lastNewline = truncated.lastIndexOf('\n');
                const safe = lastNewline > 0 ? truncated.substring(0, lastNewline) : truncated;
                comment += '### Results (truncated — see artifact for full report)\n\n' + safe;
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
