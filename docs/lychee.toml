# Lychee Link Checker Configuration
# https://github.com/lycheeverse/lychee

############################# Display #############################
verbose = "info"
no_progress = false

############################# Cache #############################
cache = true
max_cache_age = "1d"

############################# Runtime #############################
max_redirects = 10
max_retries = 3
max_concurrency = 8
timeout = 20

############################# Requests #############################
accept = ["200..=299", "429"]
# Only check http/https links, not file:// (breaks with base path)
scheme = ["https", "http"]
require_https = false

############################# Exclusions ##########################
exclude_path = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  ".bundle",
  ".jekyll-cache"
]
# SourceForge download mirrors rate-limit or block GitHub Actions IPs,
# causing false link-check failures. These URLs are verified by the
# formula-health Tier 2 installation tests, not by the link checker.
exclude = [
  "https://[^/]*\\.sourceforge\\.net"
]
exclude_all_private = false
include_mail = false

############################# Other #############################
# Only check URLs in <a href>/<img src>/markdown links — skip URLs that appear
# verbatim in code blocks (license/EULA text) or plain text (descriptions).
# Those are informational mentions, not links we maintain.
include_verbatim = false
index_files = ["index.html"]
