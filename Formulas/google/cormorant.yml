name: cormorant
schema_version: 5
description: Cormorant is a free display type family developed by Christian Thalmann.
  The project currently comprises a total of 45 font files spanning 9 different visual
  styles (Roman, Italic, Infant, Infant Italic, Garamond, Garamond Italic, Upright
  Cursive, Small Caps, and Unicase) and 5 weights (Light, Regular, Medium, SemiBold,
  and Bold.) Cormorant was conceived, drawn, spaced, kerned, programmed, interpolated,
  and produced in its entirety by Christian Thalmann of Catharsis Fonts. For an illustrated
  presentation and description of the family, please visit its B&#275;hance page .
  While this project was heavily inspired by Claude Garamont's immortal legacy, Christian
  did not use any specific font as a starting point or direct reference for the designs.
  Most glyphs were drawn from scratch; when he needed guidance on a specific character,
  he searched for the term Garamond and skimmed through the results for a general
  impression. He is grateful to the creative souls on the Typophile, TypeDrawers and
  Typografie forums, and Github, for a wealth of knowledge about type design, and
  for providing a large amount of excellent feedback on Cormorant during its development.
  He also thanks the tireless folks at Glyphs, in particular Rainer Erich Scheichelbauer
  of Schriftlabor and Georg Seifert. Special thanks go to Dave Crossland and Google
  Fonts for making the libre release of this font family possible through generous
  funding of the development process. The Cormorant project is led by Christian Thalmann,
  a type designer based in Zurich, Switzerland. To contribute, see github.com/CatharsisFonts/Cormorant
homepage: https://fonts.google.com/specimen/Cormorant
