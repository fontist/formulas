description: Varta is a sans serif family that fuses warm humanity with bright clarity
  and professional crispness whos congenial personality emerges at larger sizes. It
  is a variable font that has been designed to render well down to surprisingly small
  sizes and on both low and high-quality screens, which provides a broad range of
  utility. Its features make it well suited to a variety of tasks, including sign
  systems, editorial design, packaging, and extended reading on screens. To contribute,
  see https://github.com/SorkinType/Varta Varta is published by Sorkin Type .
