  range of weights and widths, ready for all kind of typographic challenges. This
  is the Condensed family, which is part of the superfamily along with Normal , Semi
  Condensed , Semi Expanded , and Expanded families, each with 9 weights. This project
  is led by Impallari Type, a foundry based in Rosario, Argentina. It was initially
  designed by Pablo Impallari and Andres Torresi. To contribute, see github.com/impallari/Encode-Sans
