name: gelasio
schema_version: 5
description: Gelasio is an original typeface that is metrics compatible with Georgia
  in its Regular, Bold, Italic and Bold Italic weights. Its design was inspired by
  an original printed sample of a French Transitional typeface which follows the Romain
  Du Roi typeface introduced in 1702. As a transitional type, it is marked by an interest
  in rational planning and it has a tension between rigor and expression. It feels
  generally formal and rational but its rounded terminals make it more contemporary
  and friendly. It also offers an occasional flourish, especially in the italics.
  The June 2022 update offers an major language support update. In March 2024, the
  glyph set for GF Africa Pri has been enhanced with improved diacritics, along with
  the addition of some other basic language support from the 'Beyond' glyph set. Updates
  were also made to currency symbols, other symbols, spaces, and NSM localization.
  To contribute, see github.com/SorkinType/Gelasio .
