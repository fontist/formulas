schema_version: 5
description: Gudea is a readable, clear and functional typeface family, with a simple
  and condensed structure that brings a pleasant feeling when used at any size. Inspired
  by engineering documentation, it expresses the technical feeling of graphic information
  enjoyed by those who are interested in areas such as engineering, land surveying
  and architecture. Initially this type was developed for use in labels and maps,
  but it is now a versatile family that seamlessly suits any piece of design.
