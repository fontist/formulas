description: Bona Nova is a digitisation of Bona, a cursive typeface designed in 1971
  by Andrzej Heidrich — the creator of Polish banknotes. Besides giving it a digital
  form, this project was the opportunity to expand the character set, design the small
  caps, alternates and opentype functions for the typeface. Two new versions has been
  created together with the original author; a Regular and a Bold, to give the family
  a form of a classical triad. To contribute, see github.com/kosmynkab/Bona-Nova .
