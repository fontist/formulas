  serif Hebrew design. The family contains 6 upright styles, from ExtraLight to Black.
  Hebrew type family was designed by Ben Nathan, to complement the Latin Source Sans
  Pro that was designed by Paul Hunt at Adobe Type. The Assistant project is led by
  Ben Nathan, a type designer based in Tel Aviv, Israel. To contribute, see github.com/hafontia/Assistant
