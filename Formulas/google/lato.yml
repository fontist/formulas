  - family_name: Lato
    type: Bold
    full_name: Lato Bold
    post_script_name: Lato-Bold
    version: 1.104; Western+Polish opensource
    description: 'Lato is a sanserif typeface family designed in the Summer 2010 by
      Warsaw-based designer Lukasz Dziedzic ("Lato" means "Summer" in Polish). It
      tries to carefully balance some potentially conflicting priorities: it should
      seem quite "transparent" when used in body text but would display some original
      traits when used in larger sizes. The classical proportions, particularly visible
      in the uppercase, give the letterforms familiar harmony and elegance. At the
      same time, its sleek sanserif look makes evident the fact that Lato was designed
      in 2010, even though it does not follow any current trend. The semi-rounded
      details of the letters give Lato a feeling of warmth, while the strong structure
      provides stability and seriousness.'
