name: scope_one
schema_version: 5
description: Scope One is a light slab serif typeface with elegant expressions that
  make it broadly useful for many different contexts. The design is optimized for
  titling and display usage and is ideally used at 14 points and above. The tall vertical
  proportions of the lowercase mean that it can be used in a way similar to small
  caps, giving a more refined typographic impression. It supports a broad range of
  languages using the Latin writing system. The font has been enhanced for good on-screen
  display quality, and has been tested extensively in a variety of on-screen and print
  environments. Scope One is a Dalton Maag original design commissioned by Google
  Fonts for use in presentation slide decks. A foundry specimen is maintained at daltonmaag.github.io/scope-one
  To contribute, see github.com/daltonmaag/scope-one
