name: darker_grotesque
schema_version: 5
description: Darker Grotesque is a contemporary grotesque designed by Gabriel Lam,
  inspired by the post-modern and brutalism typographic trends. This is an original
  Vietnamese typeface designed by a Vietnamese type designer, ViệtAnh Nguyễn. In 2023,
  an upgrade fixed some issues, taking the opportunity to make the font variable.
  To contribute, see github.com/bettergui/DarkerGrotesque . Darker Grotesque là bộ
  mặt chữ không chân đương đại được thiết kế bởi Gabriel Lam (Gia Lâm Bảo) và được
  truyền cảm hứng từ phong trào thiết kế chữ post-modern và brutalism. Cả bộ chữ bao
  gồm 14 kiểu, 7 loại trọng lượng khác nhau kèm theo phiên bản nghiêng. Đây là một
  thiết kế mặt chữ Việt Nam được thiết kế bởi người Việt Nam. Năm 2023 có thêm bản
  nâng cấp để sửa một số lỗi nhỏ và hỗ trợ phông chữ đa hình. Hãy đóng góp cho dự
  án của chúng tôi ở github.com/bettergui/DarkerGrotesque .
