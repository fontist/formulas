name: gulzar
schema_version: 5
description: 'Gulzar is a contemporary Urdu Nasta’liq typeface – and its Latin counterpart
  – designed and developed through a collaboration by Borna Izadpanah (Principal Designer
  and Project Leader), Simon Cozens (Font Engineering), Alice Savoie (Designer, Gulzar
  Latin), Fiona Ross (Consultant, Gulzar Urdu), Amir Mahdi Moslehi (Calligraphic adviser,
  Gulzar Urdu) and Martin Dodds (Consultant, Gulzar Urdu). This typeface was designed
  to provide an effective textual communication tool primarily for Urdu readers on
  digital platforms and in print. In Gulzar, the aim has been to produce a typeface
  which is legible at text sizes and suitable for sustained reading. The first phase
  of this project involved conducting research into the history of Urdu digital typefaces
  from the early 1980s. The design of Gulzar was inspired by carefully collected specimens
  of Urdu calligraphy and lettering which were closely studied to achieve an accurate
  representation of the Urdu flavour of the Nasta’liq style. Once the Nasta’liq design
  was firmly established, a proposal was made for a Latin counterpart that took inspiration
  from two eminent humanistic references: the versatile and sturdy proportions of
  Robert Granjon’s types, coupled with the sharp and distinctive feel of Hendrik van
  den Keere’s work. The Latin letterforms thus feature some subtle references to their
  calligraphic roots and echo the contrast present in the Nasta’liq, while remaining
  embedded in their classical typographic proportions. Gulzar is not the first OpenType
  Nasta’liq typeface, but it is the first Nasta’liq type for which an original Latin
  counterpart was designed. It covers all the required transliterations characters
  to transcribe Arabic, Persian and Urdu languages. You can read more about the inspiration,
  design, and engineering of Gulzar at gulzarfont.org . To contribute, see github.com/googlefonts/Gulzar/
  .'
