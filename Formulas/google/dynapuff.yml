name: dynapuff
schema_version: 5
description: "Dynapuff’s loveable demeanor and hand-drawn charm makes it well suited
  for your, “zomg’s” and “asdfajlskdfjalksdfjkj’s” . \U0001F602\U0001F602\U0001F602\U0001F602\U0001F602
  Dynapuff features OpenType code that alternates the vertical position of the letters
  to make those “noooooooooo waaaaaaay” s appear hand-drawn and less like a robot
  texting on a typewriter. Give it a whirl in Google’s keyboard ( Gboard ) where you
  can transform text messages into typographic stickers. Plain text “hahas” are a
  thing of the past after you’ve sent an “lol” in Dynapuff. What Dynapuff might lack
  in subtlety, it makes up for it with its playful and flexible typographic energy.
  Designed by Toshi Omagari, this casual typeface is optimized for legibility in small
  text environments like stickers or candy packaging. It also manages to be large
  when displayed in children’s books to shop signage. To contribute see github.com/googlefonts/dynapuff
  ."
