name: honk
schema_version: 5
description: Loud, bright, and exuberantly fun! Honk is a variable colour font from
  Ek Type. It is a riotous digital interpretation of the bold and boisterous lettering
  seen on Indian trucks. An extravaganza of form and colour, Honk is a modular system
  with ten distinct styles, shadows, and colour palettes. An embodiment of India's
  colourful complexity, it effortlessly oscillates between simple and subtle to over-the-top
  and ornate. It's the kind of font that doesn't just speak; it shouts, honks, and
  sings with its varied styles, dynamic shape-shifting and use of colorv1 technology.
  Honk reflects the essence of India's vibrant spirit, and it does so with an audacious
  flair. So, the next time you need a font that's as lively as an Indian street corner,
  give Honk a try. It is a typographic adventure you won't forget! This project is
  designed, engineered and maintained by Ek Type; a collective of type designers focused
  on designing contemporary Indian typefaces. Honk is designed by Noopur Datye and
  Yesha Goshar, and engineered by Sidharth Jaishankar and Girish Dalvi, emojis are
  designed by Athul Jayaraman and testing is done by Taresh Vohra and team Ek Type.
  A big honk to all the amazing designers who helped by open sourcing their color/element-based
  variable fonts. This font uses the COLRv1 and CPAL tables. Please visit the gf-guide
  color page to learn more about Color Fonts technology. To contribute, see github.com/EkType/Honk
