name: zen_kaku_gothic_antique
schema_version: 5
description: 'Zen Kaku Gothic New is a contemporary Japanese gothic (san serif) typeface
  family. With this font, you can express fine typesetting without any professional
  detailed arrangements. Because of the unique yet simple design, it gives naturally
  high legibility. Easy to use and read. Zen Kaku Gothic Antique is a classical yet
  simple and stylish version. Highly legible due to orthodox letterform design, and
  great for various usage, from title to text, and even captions. To contribute to
  the project, visit github.com/googlefonts/zen-kakugothic Zen Kaku Gothic New はベーシックな日本語のサンセリフ(ゴシック体)ファミリーです。
  この書体を用いれば、特に専門家のような細かい作業をしなくても、高品位な文字組を実現することができます。 独自のシンプルなデザインが自然な読みやすさをもたらします。
  使いやすく読みやすい書体です。 Zen Kaku Gothic Antique は古典的で、しかもシンプルで洒落たサンセリフ書体のファミリーです。 文字のデザインがオーソドックスで、きわめて判読しやすい書体です。
  タイトルから本文、キャプションまで、さまざまな用途で効果的にご利用いただけます。 このプロジェクトに参加して貢献したい方は、次の URL をご参照ください github.com/googlefonts/zen-kakugothic
  To learn more, read Say Hello to our big new Japanese collection with Zen Fonts
  (English), The Story of Zen Fonts - interview with Yoshimichi Ohira (English), Zenフォント:
  新しい日本語フォントコレクションの登場 - 日本語フォントの複雑な美しさについて - (Japanese), and Zenフォントのおはなし：大平善道さんとのインタビュー
  (Japanese).'
