name: kablammo
schema_version: 5
description: Kablammo is an experimental variable font, taking inspiration from maximalist
  curly doodad designs from the ’90s, the Memphis Design movement, as well as cartoons
  and toys from those eras. Kablammo has one variable axis, Morph(MORF), which makes
  the glyphs dance. The decorative elements fly all over the place, along with shifting
  weight and contrast. This lends itself particularly well to animations. Each glyph
  has four primary states that be morphed between, and can be considered the most
  stable and considered forms. Each of these are accessible as instances (styles)
  in font menus that properly support variable fonts. This offers a quick alternative
  for accessing the alternate forms, and can be handy if you don’t need all the variety,
  and in-between states of the full variable font. Kablammo was designed by Vectro
  Type Foundry and released in 2023. To contribute, please see github.com/Vectro-Type-Foundry/kablammo
  .
