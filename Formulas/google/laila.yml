name: laila
schema_version: 5
description: Laila is an informal sans serif design with brush terminals. It has a
  very contemporary, 21st century appearance. Text set in Laila appears friendly,
  or even cute! Laila looks especially good in headlines. It is a display typeface,
  but it may also be used to set shorter passages of text, too. Laila’s Latin component
  has a high x-height and open counter forms. In terms of the thickness of its strokes,
  everything is mostly monolinear. The Devanagari component is even more fluid, appearing
  lively and graceful. The height is between the Latin x-height and capital height.
  The strokes thickness is a little lighter than in the Latin; in text blocks, texts
  set in each script will have similar color. Hitesh Malaviya designed the Devanagari,
  and the Latin is by Jonny Pinhorn. To contribute, see github.com/itfoundry/laila
