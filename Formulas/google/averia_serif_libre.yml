name: averia_serif_libre
schema_version: 5
description: Avería ("breakdown" or "mechanical damage" in Spanish - related to the
  root of the English word "average") is a Unicode typeface superfamily created from
  the average of all fonts on the computer of the creator, Dan Sayers. The process
  is described at iotic.com/averia . All metrics are the result of an averaging process.
  The included glyphs are those that existed in a majority of the source fonts. The
  Averia Libre families of fonts are based on the average of all 725 fonts in the
  Google Web Fonts project, released under the SIL Open Font License, as of 9 Nov
  2011. Averia Serif Libre exists in 6 styles, and there are also the Averia Libre
  , Averia Sans Libre and Averia Gruesa Libre families. For more information please
  visit the Avería page on the iotic website or send an email to Dan Sayers .
