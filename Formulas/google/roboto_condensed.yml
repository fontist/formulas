---
name: roboto_condensed
schema_version: 5
description: Roboto has a dual nature. It has a mechanical skeleton and the forms
  are largely geometric. At the same time, the font features friendly and open curves.
  While some grotesks distort their letterforms to force a rigid rhythm, Roboto doesn’t
  compromise, allowing letters to be settled into their natural width. This makes
  for a more natural reading rhythm more commonly found in humanist and serif types.
  This is the Condensed family, which can be used alongside the normal Roboto family
  and the Roboto Slab family. In August 2023, the family has been upgraded to a variable
  font. To contribute, please see github.com/googlefonts/roboto-classic .
homepage: https://fonts.google.com/specimen/Roboto+Condensed
