name: m_plus_u
schema_version: 5
description: M+ FONTS is a little nifty font family for everyday usage. Mplus U is
  a Sans Serif font with nine weights from Thin to Black, supporting 5,700+ Kanjis
  for Japanese with GF Latin Plus. To further enhance visibility, legibility, and
  readability, the internal spaces of the glyphs are designed to be wider and maximize
  the size of the voiced/semi-voiced sound mark on the kana characters. This font
  is intended for use in UIs, and as an accessible/readability font (UD font). As
  a side effect, this font has a very cute appearance :-) To contribute to the project,
  visit github.com/coz-m/MPLUS_FONTS
homepage: https://fonts.google.com/specimen/M+PLUS+U
