name: syne
schema_version: 5
description: 'The Syne family was originally designed in 2017 for the Art Center "Synesthésie",
  based in Saint-Denis — a suburb of Paris. The Art Center aims to gather diverse
  artistic personalities in order to create new and enriching situations. Based on
  that idea, Syne is an exploration of atypical associations of weights and styles.
  Syne Regular is the starting point of the family. It is quite an archetypal geometric
  sans-serif, giving the art center a practical asset for their daily use. When getting
  bolder, the typeface also gets wider, forcing radical graphic design choices. Checkout
  the other two members of this heteroclite family: Syne Mono and Syne Tactile . A
  Greek script designed by George Triantafyllakos has been added in March 2022. Syne
  was conceptualized by Bonjour Monde and designed by Lucas Descroix with the help
  of Arman Mohtadji. To contribute, see gitlab.com/bonjour-monde/fonderie/syne-typeface'
