---
name: handjet
schema_version: 5
description: 'Handjet is an element-based variable font (aka pixel font, modular font,
  …) where every glyph is composed using multiple copies of the same element. Each
  element can take one of 23 shapes and transition smoothly between them while creating
  various effects. The font currently supports these scripts: Arabic, Armenian, Cyrillic,
  Greek, Hebrew, and Latin. Due to rendering issues specific to Mac OS, the font may
  show aberrations and visual artifacts, resulting in an unusual appearance. Handjet
  is designed by David Březina with the contribution of Johannes Neumeier, Borna Izadpanah,
  Khajag Apelian and Meir Sadan. To contribute see github.com/rosettatype/handjet
  .'
homepage: https://fonts.google.com/specimen/Handjet
