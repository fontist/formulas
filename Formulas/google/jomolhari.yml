description: Jomolhari is a free, Unicode compatible, Tibetan script font named after
  Mt Jomolhari on the border of Bhutan and Tibet. This font can be used for Tibetan
  and Dzongkha text. It was inspired by Bhutanese manuscript examples and was originally
  designed for use in publishing traditional Buddhist texts.
