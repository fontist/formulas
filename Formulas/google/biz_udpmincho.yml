description: モリサワのBIZ UD明朝は、教育やビジネス文書作成などに活用できるよう、より多くの方にとって読みやすく使いやすいように設計されたユニバーサルデザインフォントです。格調高い明朝体の伝統を保ちながら、見やすさ、読みやすさを実現した書体です。一般的な明朝体は、横線が細くデザインされているため、視力が弱い方やディスプレイの表示などでは読みにくいことがあります。BIZ
  UD明朝は従来の明朝体よりも横線が太い明朝体をベースにしており、濁点や半濁点を大きく見やすいデザインに変更しているほか、字面やふところを大きくとりながらも文字のフォルムを崩さないデザインに調整しています。
  BIZ UD Mincho is a universal design typeface designed to be easy to read and ideal
  for education and business documentation. It combines high quality in readability
  and legibility while carrying on the stately Japanese Mincho type tradition. BIZ
  UD Mincho bases its design on one of the typefaces from the Morisawa font library,
  which has thicker horizontal lines than the traditional Mincho type style. Because
  most Mincho types have thin horizontal strokes, the style can be difficult to read
  on some displays or signs and for people with low vision. For the universal design
  version, dakuten (゛) and handakuten (゜) voicing marks are designed to be more legible,
  and the letterforms are adjusted to maintain their balance while having a larger
  face and wider counters. UDMincho includes full-width kana. UDPMincho includes proportional-width
  kana. To contribute to the project, visit github.com/googlefonts/morisawa-biz-ud-mincho
  To learn more, read Morisawa BIZ Universal Design (UD) Japaese fonts added to Google
  Fonts and Google Workspace .
