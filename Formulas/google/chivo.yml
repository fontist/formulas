---
name: chivo
schema_version: 5
description: Chivo ("Goat" in Spanish) is Omnibus-Type's first grotesque family. The
  strength of Chivo Black makes it ideal for highlights and headlines whilst Chivo
  Regular's elegance is ideal for continuous reading. Its design details make it an
  indispensable ally for any designer. In october 2022, the family is upgraded to
  a variable font ranging from Thin to Black, including matching italics. The glyphset
  has also been extended, supporting now a wider number of languages. The family was
  developed by Héctor Gatti. To contribute, see github.com/Omnibus-Type/Chivo .
homepage: https://fonts.google.com/specimen/Chivo
