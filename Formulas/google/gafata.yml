name: gafata
schema_version: 5
description: Gafata is a font designed for small sizes in medium-long text, mixing
  elegance and readability which is why it has great applicability in books, magazines
  and web pages. In the process of finding the finest legibility, particular features
  emerged making this whimsical sans serif different from the rest, creating an original
  mark to the text it's applied to. Updated in March 2013 with updated spacing. Updated
  in April 2013 with updated hinting. To contribute to the project contact Lautaro
  Hourcade .
