name: hind
schema_version: 5
description: 'Hind is an Open Source typeface supporting the Devanagari and Latin
  scripts. Developed explicitly for use in User Interface design, the Hind font family
  includes five styles. Hind’s letterforms have a humanist-style construction, which
  is paired with seemingly monolinear strokes. Most of these strokes have flat endings:
  they either terminate with a horizontal or a vertical shear, rather than on a diagonal.
  This helps create clear-cut counter forms between the characters. In addition to
  this, Hind’s letterforms feature open apertures. The entire typeface family feels
  very legible when used to set text. The Devanagari and Latin script components are
  scaled in relation to each other so that the Devanagari headline falls just below
  the Latin capital-height. In other words, the Devanagari base characters are 94%
  as tall as the Latin uppercase. Text set in the Devanagari script sits nicely alongside
  the Latin lowercase, too. Hind’s Devanagari vowel marks take forms that tends toward
  the traditional end of the design spectrum, while the knotted terminals inside of
  the base characters feature a treatment that appears more contemporary. Each font
  in the Hind family has 1146 glyphs, which include hundreds of unique Devanagari
  conjuncts. These ensure full support for the major languages written with the Devanagari
  script. The Latin component’s character set is a basic western one, which enables
  typesetting in English and the other Western European languages. Hind is a solid
  choice for UI design, and a wise selection for electronic display embedding. Manushi
  Parikh designed Hind for the Indian Type Foundry, who first published the fonts
  in 2014. The Hind project is led by Indian Type Foundry, a type design foundry based
  in Ahmedabad, India. To contribute, see github.com/itfoundry/hind'
homepage: https://fonts.google.com/specimen/Hind
