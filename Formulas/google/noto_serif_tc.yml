description: Noto is a global font collection for writing in all modern and ancient
  languages. Noto Serif TC is a modulated (“serif”) design for languages in Taiwan,
  Hong Kong and Macau that use the Traditional Chinese variant of the Han ideograms.
  It also supports Hiragana, Katakana, Latin, Cyrillic, Greek and Hangul . It has
  multiple weights.
