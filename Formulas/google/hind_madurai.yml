name: hind_madurai
schema_version: 5
description: 'Hind Madurai is a family of five Tamil fonts, which are part of the
  Indian Type Foundry’s larger Open Source Hind Multi-Script project. In addition
  to Tamil, the Hind Madurai fonts also include Latin-script characters. Developed
  explicitly for use in User Interface design, Hind’s letterforms have a humanist-style
  construction, paired with seemingly monolinear strokes. Most of these strokes have
  flat endings: they either terminate with a horizontal or a vertical shear, rather
  than on a diagonal. This helps create clear-cut counter forms between the characters.
  Additionally, Hind’s letterforms feature open apertures and counterforms. The entire
  family feels very legible when used to set text. The Tamil and Latin script components
  are scaled in relation to each other so that the head of the Tamil characters falls
  just below the Latin capital-height. Depending in the font weight, Tamil letters
  appear to be about 80–85% of the height of the Latin uppercase. Text set in the
  Tamil script sits nicely alongside the Latin’s lowercase, too. Although Hind Madurai
  is a “monolinear sans” face, much of its design features tends toward the traditional
  end of the design spectrum. Each font in the Hind Madurai family has 552 glyphs,
  which includes all of the characters needed to write Tamil. The Latin character
  set is Adobe Latin 3, enabling typesetting for English and other Western European
  languages. Hind Madurai is a solid alternate when choosing typefaces for UI design,
  and a wise selection for electronic display embedding. Jyotish Sonowal designed
  Hind Madurai for ITF, who first published the fonts in 2015. Hind Madurai is named
  after Madurai, a city in Tamil Nadu, India. The Hind Madurai project is led by Indian
  Type Foundry, a type design foundry based in Ahmedabad, India. To contribute, see
  github.com/itfoundry/hind-madurai'
