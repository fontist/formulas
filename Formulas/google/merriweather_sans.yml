---
name: merriweather_sans
schema_version: 5
description: 'Merriweather Sans is a low-contrast semi-condensed sans-serif text typeface
  family designed to be pleasant to read at very small sizes. Merriweather Sans is
  traditional in feeling despite the modern shapes it has adopted for screens. Merriweather
  Sans is an evolving project and will be updated. As of now there are 8 styles: Light,
  Regular, Bold, and ExtraBold weights in Roman and Italic styles. There is also Merriweather
  , a serif version which closely harmonizes with the weights and styles of this sans-serif
  family. Designed by Eben Sorkin, Merriweather Sans features a large x height, slightly
  condensed letterforms, a mild diagonal stress and open forms. Merriweather Sans
  is a work in progress and will be improved regularly. This means you can request
  improvements and even fund specific features if if they are outside of the current
  scope of work. For more information and to stay updated see Eben Sorkin''s blog
  and Flickr stream , and the MerriweatherFnt Twitter microblog. Updated in June 2013
  with italic styles. Updated in January 2016: This revision improves on-screen rendering
  especially at text sizes with ttfautohint hinting. Merriweather Sans will work better
  when installed on desktops. Some OpenType features were added and improved. Since
  the vertical and horizontal metrics changed, this may cause some text to reflow
  in some browsers. A second update (v1.006) was made on 1/25 to fix ligatures and
  other digraphs. To contribute, see github.com/SorkinType/Merriweather-Sans .'
homepage: https://fonts.google.com/specimen/Merriweather+Sans
