---
name: roboto_mono
schema_version: 5
description: Roboto Mono is a monospaced addition to the Roboto type family. Like
  the other members of the Roboto family, the fonts are optimized for readability
  on screens across a wide variety of devices and reading environments. While the
  monospaced version is related to its variable width cousin, it doesn&#8217;t hesitate
  to change forms to better fit the constraints of a monospaced environment. For example,
  narrow glyphs like &#8216;I&#8217;, &#8216;l&#8217; and &#8216;i&#8217; have added
  serifs for more even texture while wider glyphs are adjusted for weight. Curved
  caps like &#8216;C&#8217; and &#8216;O&#8217; take on the straighter sides from
  Roboto Condensed. Special consideration is given to glyphs important for reading
  and writing software source code. Letters with similar shapes are easy to tell apart.
  Digit &#8216;1&#8217;, lowercase &#8216;l&#8217; and capital &#8216;I&#8217; are
  easily differentiated as are zero and the letter &#8216;O&#8217;. Punctuation important
  for code has also been considered. For example, the curly braces &#8216;{&nbsp;}&#8217;
  have exaggerated points to clearly differentiate them from parenthesis &#8216;(&nbsp;)&#8217;
  and braces &#8216;[&nbsp;]&#8217;. Periods and commas are also exaggerated to identify
  them more quickly. The scale and weight of symbols commonly used as operators have
  also been optimized.
homepage: https://fonts.google.com/specimen/Roboto+Mono
