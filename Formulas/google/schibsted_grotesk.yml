name: schibsted_grotesk
schema_version: 5
description: Schibsted Grotesk is a digital-first font family crafted for user interfaces.
  Taking visual cues from Schibsted's proud history of printed media as well as our
  pioneering digital nature, Schibsted Grotesk was designed to become an active tool
  that empowers brand ambassadors and inspires internal and external audiences. Schibsted
  Grotesk covers the Underware Latin Plus character set, using 4 masters distributed
  across weights and italics. To contribute, see github.com/schibsted/schibsted-grotesk
  .
homepage: https://fonts.google.com/specimen/Schibsted+Grotesk
