description: Omnibus Type proudly presents Rosario, a new typeface of classic proportions,
  subtle contrast and weak endings. Carefully produced, elegant, ideal for magazines
  and academic journals. Rosario is the name of the city of the designer, Héctor Gatti.
  Rosario was initially developed for private use in 2003. In September 2019, The
  family has been converted to a variable font family. To contribute, see github.com/Omnibus-Type/Rosario
  .
