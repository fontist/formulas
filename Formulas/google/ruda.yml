description: Ruda is a sans serif typeface originally developed for a specific context
  of use, product labels. Designed by Mariela Monsalve and Angelina Sanchez, Ruda
  features a very large x-height, low cap-height and open forms. In Febraury 2020,
  the family has been upgraded to a variable font. To contribute, see github.com/marmonsalve/Ruda-new
  . Ruda is a collaboration between marie monsalve and Angelina Saanchez.
