name: edu_vic_wa_nt_beginner
schema_version: 5
description: 'The Foundation Fonts for Australian Schools collection is a set of handwriting
  fonts designed specifically to meet Australian Education standards. While weights,
  widths and optical sizes were carefully crafted to work well in an Australian classroom
  environment, they are just as comfortable to read and work with in the home environment.
  Each Australian state teaches different handwriting styles in lower primary school
  (although some states do share the same style). There are essentially three stages
  involved with each state''s styles: The foundational stage involves learning basic
  letter formation. The transitional stage adds joining ligatures to some letters.
  The cursive stage joins almost all letters (with some exceptions). The VIC WA NT
  School Fonts include: Victoria, Western Australia and Northern Territory Label Print
  Alphabet - a simple sloped print for early primary school. Students in Victoria,
  Western Australia and Northern Territory learn Label Print from years 1 to 3 and
  Infant Cursive from year 4. Google Workspace users are provided standard versions
  online, however they may download or build the complete OpenType versions from GitHub
  for local installations. To download the full version, or to contribute, see github.com/MezMerrit/AU-School-Handwriting-Fonts
  .'
