  Open source

  Open source is when the source code has free licensing. In case of fonts, the
  concept of open source is only relevant for when the fonts are manually
  hinted; the hinting effectively becomes software source code, and such code in
  Type Design is open source and public domain.

  In case of other typographical utilities such as renderers and text editors,
  the licensing is determined by many legal and practical considerations. For
  example, as TD renderer has modified FreeType source code in it, it is
  impossible for the whole renderer to be public domain, so it inherits FreeType
  license. Therefore there are plans to develop TD renderer 2, which will be
  completely freetypeless and public domain. Public domain projects may use an
  embedded bitmap renderer such as embedded TD bitmaps 1 6x14 1.5 dev1.

  Public domain

  Public domain involves the object having waived any rules of intellectual
  property (copyright, trademark and/or patent). Public domain is not to be
  confused with open source, as public domain software don't have to have their
  source available, and open-source software are not necessarily public domain.
  All fonts at Type Design are public domain. They ARE public domain, which is
  dependent on the copyright laws around the world because it requires waiving
  the copyright laws. By the system of public domain software, you may freely
  distribute, modify, publish, delete, relicense, use, sell or clone any of your
  forks of any of the font files of Type Design, following a public domain
  license such as CC0, Unlicense or WTFPL.

